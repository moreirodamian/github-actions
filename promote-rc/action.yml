name: "Promote RC to Final Release"
description: "Creates a final release tag (vX.Y.Z) from an RC tag (vX.Y.Z-rc.N), regenerates a clean changelog from git history (prev_final → new_final), and converts the latest RC release into the final release (preserving its assets)."

inputs:
  rc_tag:
    description: "Specific RC tag to promote (e.g. v1.2.3-rc.2). If empty, uses the latest RC tag. The final release body is regenerated from git history between the previous platform-compatible final tag and the selected RC commit (the same generator used by generate-release)."
    required: false
    default: ""
  commit_format:
    description: "Commit categorization format passed to generate-changelog.sh: 'labels' (default), 'conventional', or 'none'."
    required: false
    default: "labels"
  issue_tracker_url:
    description: "Base URL for issue links (e.g. https://jira.example.com/browse/). Empty = no links."
    required: false
    default: ""
  ticket_prefixes:
    description: "Space-separated project prefixes to match in tickets (e.g. 'PROJ OPS'). Empty = match all."
    required: false
    default: ""
  git_user_name:
    description: "Git user name for tagging."
    required: false
    default: "github-actions"
  git_user_email:
    description: "Git user email for tagging."
    required: false
    default: "github-actions@github.com"

outputs:
  final_version:
    description: "The finalized version tag (e.g. v1.2.3)"
    value: ${{ steps.finalize.outputs.final_version }}
  rc_tag:
    description: "The RC tag that was promoted"
    value: ${{ steps.finalize.outputs.rc_tag }}
  platforms:
    description: "Platform annotation from the RC tag"
    value: ${{ steps.finalize.outputs.platforms }}
  already_exists:
    description: "Whether the final tag already existed (true/false)"
    value: ${{ steps.finalize.outputs.already_exists }}
  previous_final_tag:
    description: "The previous platform-compatible final tag used as the changelog base"
    value: ${{ steps.finalize.outputs.previous_final_tag }}

runs:
  using: "composite"
  steps:
    - name: Checkout consumer repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - id: finalize
      name: Create final tag from RC and regenerate clean changelog
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RC_TAG_INPUT: ${{ inputs.rc_tag }}
        GIT_USER_NAME: ${{ inputs.git_user_name }}
        GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        COMMIT_FORMAT: ${{ inputs.commit_format }}
        ISSUE_TRACKER_BASE_URL: ${{ inputs.issue_tracker_url }}
        TICKET_PREFIXES: ${{ inputs.ticket_prefixes }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Resolve RC tag
        RC_TAG="${RC_TAG_INPUT:-}"
        RC_TAG="$(echo "${RC_TAG}" | xargs || true)"

        if [[ -z "${RC_TAG}" ]]; then
          echo "Searching for latest release candidate tag..."
          RC_TAG="$(git tag -l 'v*-rc.*' --sort=-creatordate | head -n 1 || true)"
        fi

        if [[ -z "${RC_TAG}" ]]; then
          echo "::error::No RC tag found."
          exit 1
        fi

        if [[ ! "${RC_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
          echo "::error::Invalid RC tag format: ${RC_TAG} (expected vX.Y.Z-rc.N)"
          exit 1
        fi

        echo "Found RC tag: ${RC_TAG}"
        echo "rc_tag=${RC_TAG}" >> "$GITHUB_OUTPUT"

        RC_COMMIT="$(git rev-list -n 1 "${RC_TAG}")"

        # Extract base version vX.Y.Z
        FINAL_TAG="${RC_TAG%%-rc.*}"
        echo "Final tag to create: ${FINAL_TAG}"

        # ── Resolve platforms (from RC tag annotation, fallback to release body)
        TAG_MSG="$(git for-each-ref "refs/tags/${RC_TAG}" --format='%(contents)' || true)"
        PLATFORM=""
        if [[ -n "${TAG_MSG}" ]]; then
          PLATFORM="$(printf '%s\n' "${TAG_MSG}" \
            | awk -F':' 'tolower($1) ~ /platforms/ {gsub(/^[[:space:]]+|[[:space:]]+$/,"",$2); print tolower($2); exit}')"
        fi
        if [[ -z "${PLATFORM}" ]]; then
          BODY="$(gh release view "${RC_TAG}" --json body -q .body 2>/dev/null || true)"
          if [[ -n "${BODY}" ]]; then
            PLATFORM="$(printf '%s\n' "${BODY}" \
              | awk -F':' 'tolower($1) ~ /platforms/ {gsub(/^[[:space:]]+|[[:space:]]+$/,"",$2); print tolower($2); exit}')"
          fi
        fi
        case "${PLATFORM}" in
          mobile|web|all) ;;
          *) PLATFORM="all" ;;
        esac
        echo "Platforms: ${PLATFORM}"
        echo "platforms=${PLATFORM}" >> "$GITHUB_OUTPUT"

        # ── Find previous platform-compatible final release (same logic as generate-release/action.yml)
        REPO="${GITHUB_REPOSITORY}"
        case "${PLATFORM}" in
          mobile) plat_regex="^platforms:[[:space:]]*(mobile|all)\\b" ;;
          web)    plat_regex="^platforms:[[:space:]]*(web|all)\\b" ;;
          *)      plat_regex="^platforms:[[:space:]]*(mobile|web|all)\\b" ;;
        esac

        PREV_FINAL=""
        JSON="$(gh api -H "Accept: application/vnd.github+json" \
          "/repos/${REPO}/releases?per_page=200" 2>/dev/null || echo "[]")"

        if [[ "${JSON}" != "[]" ]]; then
          PREV_FINAL="$(echo "${JSON}" | jq -r --arg CUR "${FINAL_TAG}" --arg RC "${RC_TAG}" --arg RE "${plat_regex}" '
            [ .[]
              | select((.draft // false) | not)
              | select((.prerelease // false) | not)
              | select(.tag_name != $CUR and .tag_name != $RC)
              | select((.tag_name | test("-rc\\.[0-9]+$")) | not)
              | select((.body // "") | test($RE; "im"))
            ]
            | sort_by(.created_at)
            | (last // empty)
            | .tag_name // empty
          ' 2>/dev/null || true)"
        fi

        if [[ -z "${PREV_FINAL}" ]]; then
          echo "No platform-compatible previous final release found. Falling back to chronological tag."
          PREV_FINAL="$(git --no-pager tag --sort=creatordate --merged "${RC_COMMIT}" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v -F "${FINAL_TAG}" \
            | tail -1 || true)"
        fi

        echo "Previous final tag: ${PREV_FINAL:-<none>}"
        echo "previous_final_tag=${PREV_FINAL}" >> "$GITHUB_OUTPUT"

        # ── Configure git identity (used for tag creation)
        git config user.name "${GIT_USER_NAME}"
        git config user.email "${GIT_USER_EMAIL}"

        # ── Idempotency: skip if final tag already exists
        if git rev-parse "${FINAL_TAG}" >/dev/null 2>&1; then
          echo "::warning::Final tag ${FINAL_TAG} already exists. Skipping promotion."
          echo "final_version=${FINAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "already_exists=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "already_exists=false" >> "$GITHUB_OUTPUT"

        # ── Create final annotated tag pointing at the RC commit (BEFORE running changelog
        # so generate-changelog.sh can resolve CURR_TAG with `git log ... ${FINAL_TAG}`)
        git tag -a "${FINAL_TAG}" "${RC_COMMIT}" -m "platforms: ${PLATFORM}"
        git push origin "${FINAL_TAG}"
        echo "Final tag ${FINAL_TAG} created and pushed at ${RC_COMMIT}."

        # ── Generate clean changelog using sibling action's script (downloaded by Actions runtime)
        CHANGELOG_SCRIPT="${ACTION_PATH}/../generate-release/generate-changelog.sh"
        if [[ ! -f "${CHANGELOG_SCRIPT}" ]]; then
          echo "::error::generate-changelog.sh not found at ${CHANGELOG_SCRIPT}"
          exit 1
        fi
        chmod +x "${CHANGELOG_SCRIPT}" || true

        NOTES_FILE="$(mktemp)"
        if [[ -n "${PREV_FINAL}" ]]; then
          "${CHANGELOG_SCRIPT}" "${PREV_FINAL}" "${FINAL_TAG}" "${PLATFORM}" > "${NOTES_FILE}"
        else
          echo "::warning::No previous final tag — generating changelog against root commit."
          ROOT_COMMIT="$(git rev-list --max-parents=0 HEAD | tail -1)"
          "${CHANGELOG_SCRIPT}" "${ROOT_COMMIT}" "${FINAL_TAG}" "${PLATFORM}" > "${NOTES_FILE}"
        fi
        echo "Changelog generated ($(wc -l < "${NOTES_FILE}") lines)."

        # ── Convert the RC release into the final release: rename tag, replace body,
        # mark as latest. Assets attached to the RC release are preserved by `gh release edit`.
        if gh release view "${RC_TAG}" >/dev/null 2>&1; then
          gh release edit "${RC_TAG}" \
            --tag "${FINAL_TAG}" \
            --title "${FINAL_TAG}" \
            --notes-file "${NOTES_FILE}" \
            --prerelease=false \
            --latest
          echo "Converted release ${RC_TAG} into ${FINAL_TAG} (clean changelog, assets preserved)."
        else
          echo "::warning::No GitHub Release for ${RC_TAG} — creating final release without assets."
          gh release create "${FINAL_TAG}" \
            --title "${FINAL_TAG}" \
            --notes-file "${NOTES_FILE}" \
            --latest
        fi

        echo "final_version=${FINAL_TAG}" >> "$GITHUB_OUTPUT"
        rm -f "${NOTES_FILE}"

    - name: Job Summary
      if: always()
      shell: bash
      env:
        FINAL_VERSION: ${{ steps.finalize.outputs.final_version }}
        RC_TAG: ${{ steps.finalize.outputs.rc_tag }}
        PLATFORMS: ${{ steps.finalize.outputs.platforms }}
        ALREADY_EXISTS: ${{ steps.finalize.outputs.already_exists }}
        PREV_FINAL: ${{ steps.finalize.outputs.previous_final_tag }}
      run: |
        {
          echo "## Promote RC Summary"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| RC Tag | \`${RC_TAG:-N/A}\` |"
          echo "| Final Version | \`${FINAL_VERSION:-N/A}\` |"
          echo "| Previous Final | \`${PREV_FINAL:-<none>}\` |"
          echo "| Platforms | ${PLATFORMS:-N/A} |"
          echo "| Already Existed | ${ALREADY_EXISTS:-N/A} |"
        } >> "$GITHUB_STEP_SUMMARY"
