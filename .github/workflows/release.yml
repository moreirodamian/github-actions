name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release & Floating Tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z format"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          MAJOR="${TAG%%.*}"
          MINOR="${TAG%.*}"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Find previous tag
        id: prev
        run: |
          set -euo pipefail
          git fetch --tags --force
          PREV="$(git tag -l 'v*.*.*' --sort=-version:refname | grep -v "${GITHUB_REF_NAME}" | head -1 || true)"
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
          COMMITS="$(git rev-list "${PREV}..${GITHUB_REF_NAME}" --count 2>/dev/null || echo '?')"
          echo "commits=${COMMITS}" >> "$GITHUB_OUTPUT"

      - name: Build release header
        id: header
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREV: ${{ steps.prev.outputs.tag }}
          COMMITS: ${{ steps.prev.outputs.commits }}
        run: |
          set -euo pipefail
          DATE="$(date '+%B %d, %Y')"
          REPO="${GITHUB_REPOSITORY}"
          {
            echo "body<<BODY_EOF"
            echo "# ${TAG}"
            echo ""
            echo "> **Released:** ${DATE} | **Commits:** ${COMMITS} | **Pin:** \`uses: ${REPO}/<action>@${TAG%%.*}\`"
            echo ""
            if [[ -n "${PREV}" ]]; then
              echo "**Full diff:** [\`${PREV}...${TAG}\`](https://github.com/${REPO}/compare/${PREV}...${TAG})"
              echo ""
            fi
            echo "---"
            echo ""
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          makeLatest: true
          name: ${{ steps.tag.outputs.tag }}
          tag: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.header.outputs.body }}

      - name: Update floating tags
        run: |
          set -euo pipefail
          MAJOR="${{ steps.tag.outputs.major }}"
          MINOR="${{ steps.tag.outputs.minor }}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Update v1 (major floating tag)
          git tag -fa "$MAJOR" -m "Floating tag $MAJOR -> ${{ steps.tag.outputs.tag }}"
          git push origin "$MAJOR" --force

          # Update v1.2 (minor floating tag)
          git tag -fa "$MINOR" -m "Floating tag $MINOR -> ${{ steps.tag.outputs.tag }}"
          git push origin "$MINOR" --force

          echo "Updated floating tags: $MAJOR, $MINOR -> ${{ steps.tag.outputs.tag }}"
