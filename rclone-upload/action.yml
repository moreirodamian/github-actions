name: "Rclone Upload"
description: "Uploads files to S3-compatible storage using rclone (via Docker). Supports multiple providers with endpoint auto-detection and optional CDN cache purge."

inputs:
  source:
    description: "Local source directory to upload (relative to $GITHUB_WORKSPACE)."
    required: true
  bucket:
    description: "Target bucket and optional folder (e.g. my-bucket/frontend)."
    required: true
  access_key:
    description: "S3 access key ID."
    required: true
  secret_key:
    description: "S3 secret access key."
    required: true
  provider:
    description: "Storage provider: DigitalOcean, AWS, Wasabi, Cloudflare, MinIO, Custom."
    required: false
    default: "DigitalOcean"
  region:
    description: "Region for the storage provider (e.g. nyc3, us-east-1, eu-central-1)."
    required: false
    default: "nyc3"
  endpoint:
    description: "Custom S3 endpoint URL. If empty, auto-detected from provider + region."
    required: false
    default: ""
  acl:
    description: "Access control for uploaded files (e.g. private, public-read)."
    required: false
    default: "private"
  rclone_command:
    description: "Rclone operation: copy, sync, or move."
    required: false
    default: "copy"
  rclone_flags:
    description: "Extra rclone flags (e.g. '--transfers 8 --checkers 16')."
    required: false
    default: ""
  cdn_provider:
    description: "CDN provider to purge: none, digitalocean, cloudfront."
    required: false
    default: "none"
  cdn_id:
    description: "CDN endpoint/distribution ID for cache purge."
    required: false
    default: ""
  cdn_token:
    description: "Token for CDN purge (DO token for digitalocean, not needed for cloudfront if using OIDC)."
    required: false
    default: ""

outputs:
  files_transferred:
    description: "Number of files transferred (from rclone output)"
    value: ${{ steps.upload.outputs.files_transferred }}

runs:
  using: "composite"
  steps:
    - name: Resolve endpoint
      id: endpoint
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        REGION: ${{ inputs.region }}
        ENDPOINT_INPUT: ${{ inputs.endpoint }}
      run: |
        set -euo pipefail

        ENDPOINT="${ENDPOINT_INPUT:-}"

        if [[ -z "${ENDPOINT}" ]]; then
          PROVIDER_LOWER="$(echo "${PROVIDER}" | tr '[:upper:]' '[:lower:]')"
          case "${PROVIDER_LOWER}" in
            digitalocean)
              ENDPOINT="${REGION}.digitaloceanspaces.com"
              RCLONE_PROVIDER="DigitalOcean"
              ;;
            aws)
              ENDPOINT="s3.${REGION}.amazonaws.com"
              RCLONE_PROVIDER="AWS"
              ;;
            wasabi)
              ENDPOINT="s3.${REGION}.wasabisys.com"
              RCLONE_PROVIDER="Wasabi"
              ;;
            cloudflare)
              ENDPOINT="${REGION}.r2.cloudflarestorage.com"
              RCLONE_PROVIDER="Cloudflare"
              ;;
            minio)
              echo "::error::MinIO requires an explicit endpoint URL."
              exit 1
              ;;
            custom)
              echo "::error::Custom provider requires an explicit endpoint URL."
              exit 1
              ;;
            *)
              echo "::error::Unknown provider: ${PROVIDER}. Supported: DigitalOcean, AWS, Wasabi, Cloudflare, MinIO, Custom."
              exit 1
              ;;
          esac
        else
          # Custom endpoint
          RCLONE_PROVIDER="Other"
        fi

        echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
        echo "rclone_provider=${RCLONE_PROVIDER}" >> "$GITHUB_OUTPUT"
        echo "Resolved endpoint: ${ENDPOINT} (provider: ${RCLONE_PROVIDER})"

    - name: Write rclone config
      shell: bash
      env:
        ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        RCLONE_PROVIDER: ${{ steps.endpoint.outputs.rclone_provider }}
        ACCESS_KEY: ${{ inputs.access_key }}
        SECRET_KEY: ${{ inputs.secret_key }}
        ACL: ${{ inputs.acl }}
      run: |
        set -euo pipefail
        : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
        RCLONE_CFG_PATH="${RUNNER_TEMP}/rclone.conf"
        {
          echo "[remote]"
          echo "type = s3"
          echo "provider = ${RCLONE_PROVIDER}"
          echo "env_auth = false"
          echo "access_key_id = ${ACCESS_KEY}"
          echo "secret_access_key = ${SECRET_KEY}"
          echo "endpoint = ${ENDPOINT}"
          echo "acl = ${ACL}"
        } > "${RCLONE_CFG_PATH}"
        echo "RCLONE_CFG_PATH=${RCLONE_CFG_PATH}" >> "$GITHUB_ENV"

    - name: Upload files with rclone
      id: upload
      shell: bash
      env:
        RCLONE_CMD: ${{ inputs.rclone_command }}
        RCLONE_EXTRA: ${{ inputs.rclone_flags }}
        SOURCE: ${{ inputs.source }}
        BUCKET: ${{ inputs.bucket }}
      run: |
        set -euo pipefail

        # Validate command
        case "${RCLONE_CMD}" in
          copy|sync|move) ;;
          *) echo "::error::Unsupported rclone command: ${RCLONE_CMD}. Use copy, sync, or move."; exit 1 ;;
        esac

        echo "Uploading ${SOURCE} -> remote:${BUCKET}/ (${RCLONE_CMD})"

        # Build rclone flags
        EXTRA_FLAGS=""
        EXTRA_TRIM="$(echo "${RCLONE_EXTRA:-}" | xargs || true)"
        if [[ -n "${EXTRA_TRIM}" ]]; then
          EXTRA_FLAGS="${EXTRA_TRIM}"
        fi

        # Run rclone via Docker
        # shellcheck disable=SC2086
        docker run --rm \
          -e RCLONE_CONFIG=/root/.rclone.conf \
          -v "${RCLONE_CFG_PATH}":/root/.rclone.conf:ro \
          -v "${GITHUB_WORKSPACE}":/workspace \
          rclone/rclone:latest "${RCLONE_CMD}" \
          "/workspace/${SOURCE}" \
          "remote:${BUCKET}/" \
          --progress \
          --stats-one-line \
          ${EXTRA_FLAGS} 2>&1 | tee /tmp/rclone_output.txt

        # Extract transfer count
        TRANSFERRED="$(grep -oP 'Transferred:\s+\K[0-9]+' /tmp/rclone_output.txt | tail -1 || echo "0")"
        echo "files_transferred=${TRANSFERRED}" >> "$GITHUB_OUTPUT"

    - name: Purge CDN cache (DigitalOcean)
      if: ${{ inputs.cdn_provider == 'digitalocean' && inputs.cdn_id != '' && inputs.cdn_token != '' }}
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ inputs.cdn_token }}

    - name: Flush DO CDN
      if: ${{ inputs.cdn_provider == 'digitalocean' && inputs.cdn_id != '' && inputs.cdn_token != '' }}
      shell: bash
      env:
        CDN_ID: ${{ inputs.cdn_id }}
      run: |
        set -euo pipefail
        echo "Flushing DigitalOcean CDN: ${CDN_ID}"
        doctl compute cdn flush "${CDN_ID}" --files '*'

    - name: Purge CDN cache (CloudFront)
      if: ${{ inputs.cdn_provider == 'cloudfront' && inputs.cdn_id != '' }}
      shell: bash
      env:
        CDN_ID: ${{ inputs.cdn_id }}
      run: |
        set -euo pipefail
        echo "Creating CloudFront invalidation for distribution: ${CDN_ID}"
        aws cloudfront create-invalidation \
          --distribution-id "${CDN_ID}" \
          --paths "/*"

    - name: Job Summary
      if: always()
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        BUCKET: ${{ inputs.bucket }}
        PROVIDER: ${{ inputs.provider }}
        ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        RCLONE_CMD: ${{ inputs.rclone_command }}
        CDN_PROVIDER: ${{ inputs.cdn_provider }}
        TRANSFERRED: ${{ steps.upload.outputs.files_transferred }}
      run: |
        {
          echo "## Rclone Upload Summary"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| Source | \`${SOURCE}\` |"
          echo "| Destination | \`${BUCKET}\` |"
          echo "| Provider | ${PROVIDER} |"
          echo "| Endpoint | \`${ENDPOINT}\` |"
          echo "| Operation | ${RCLONE_CMD} |"
          echo "| CDN Purge | ${CDN_PROVIDER} |"
          echo "| Files Transferred | ${TRANSFERRED:-N/A} |"
        } >> "$GITHUB_STEP_SUMMARY"
